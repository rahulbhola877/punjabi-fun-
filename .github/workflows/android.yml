name: Android APK

# Builds an installable debug APK of the game (Capacitor wrapper around the
# Vite build) on every push to main, and attaches it to the "apk-latest" release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk punjabi-fun-shun.apk
      - uses: actions/upload-artifact@v4
        with:
          name: punjabi-fun-shun-apk
          path: punjabi-fun-shun.apk
      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest punjabi-fun-shun.apk --title "Punjabi Fun Shun (Android, latest)" --notes "Debug APK built from ${GITHUB_SHA::7}. Install on Android: allow 'install unknown apps' for your browser or file manager." --prerelease
